name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frontend dependencies
        run: npm install
      - name: Frontend tests
        run: npm test
      - name: Frontend production build
        run: npm run build
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Check backend syntax
        run: python -m compileall -q backend

      - name: Install training dependencies
        run: python -m pip install -r requirements-train.txt
      - name: Check training Python syntax
        run: python -m compileall -q training
      - name: Validate Colab notebook JSON
        run: python -c "import json; json.load(open('training/colab_train.ipynb', encoding='utf-8'))"
